<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥢 今日食运 - 中午吃什么</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景星星动画 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 主容器 */
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        0 0 100px rgba(255, 183, 77, 0.2);
            text-align: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* 标题区域 */
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(254, 202, 87, 0.5)); }
        }

        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* 抽签按钮 */
        .fortune-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(238, 90, 36, 0.4);
            position: relative;
            overflow: hidden;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .fortune-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(238, 90, 36, 0.5);
        }

        .fortune-button:active {
            transform: translateY(0);
        }

        .fortune-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .fortune-button:hover::before {
            left: 100%;
        }

        .fortune-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 结果区域 */
        .result {
            margin-top: 40px;
            display: none;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.show {
            display: block;
        }

        /* 食运签筒 */
        .fortune-card {
            background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
            border: 3px solid #feca57;
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(254, 202, 87, 0.3);
        }

        .fortune-card::before {
            content: '🥢';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 时令标签 */
        .season-tag {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* 食品名称 */
        .food-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2d3436;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .food-emoji {
            font-size: 4rem;
            display: block;
            margin: 20px 0;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 食运签名 */
        .fortune-signature {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            position: relative;
            border: 2px dashed #e17055;
        }

        .fortune-signature::before {
            content: '✨';
            position: absolute;
            top: -15px;
            left: 20px;
            font-size: 1.5rem;
        }

        .fortune-signature-label {
            font-size: 0.9rem;
            color: #d35400;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .fortune-signature-text {
            font-size: 1.1rem;
            color: #2d3436;
            font-style: italic;
            line-height: 1.6;
        }

        /* 推荐理由 */
        .recommendation {
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .recommendation-label {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .recommendation-text {
            font-size: 1rem;
            line-height: 1.8;
        }

        /* 多个食品展示 */
        .food-items {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .food-item {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* 加载动画 */
        .loading {
            display: none;
            margin: 30px 0;
        }

        .loading.show {
            display: block;
        }

        .loading-emoji {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 烟花效果 */
        .firework {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: firework 1s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes firework {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(20);
                opacity: 0;
            }
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .title {
                font-size: 1.8rem;
            }

            .food-name {
                font-size: 1.5rem;
            }

            .fortune-button {
                padding: 15px 40px;
                font-size: 1.2rem;
            }

            .container {
                padding: 25px;
            }
        }

        /* 装饰元素 */
        .decoration {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .decoration-1 { top: 20px; left: 20px; animation-delay: 0s; }
        .decoration-2 { top: 20px; right: 20px; animation-delay: 0.5s; }
        .decoration-3 { bottom: 20px; left: 20px; animation-delay: 1s; }
        .decoration-4 { bottom: 20px; right: 20px; animation-delay: 1.5s; }
    </style>
</head>

    <script>
        // 创建背景星星
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // 音效生成（使用Web Audio API）
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'click') {
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'reveal') {
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } else if (type === 'success') {
                // 成功音效 - 三连音
                const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
                notes.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.setValueAtTime(freq, audioContext.currentTime + index * 0.15);
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime + index * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.15 + 0.2);
                    osc.start(audioContext.currentTime + index * 0.15);
                    osc.stop(audioContext.currentTime + index * 0.15 + 0.2);
                });
            }
        }

        // 创建烟花效果
        function createFirework() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * window.innerWidth + 'px';
                    firework.style.top = Math.random() * window.innerHeight + 'px';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(firework);
                    setTimeout(() => firework.remove(), 1000);
                }, i * 50);
            }
        }

            const seasonName = currentSeason.name;

            // 获取临近节气（前后各一个）
            const allSeasons = ['立春', '雨水', '惊蛰', '春分', '清明', '谷雨', '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑', '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至', '小寒', '大寒'];
            const currentIndex = allSeasons.indexOf(seasonName);

            let nearbySeasons = [seasonName];
            if (currentIndex > 0) nearbySeasons.push(allSeasons[currentIndex - 1]);
            if (currentIndex < allSeasons.length - 1) nearbySeasons.push(allSeasons[currentIndex + 1]);

            // 特殊节气：春节、元宵、端午、中秋
            const specialSeasons = ['春节', '元宵', '端午', '中秋'];
            specialSeasons.forEach(s => {
                if (!nearbySeasons.includes(s)) nearbySeasons.push(s);
            });

            // 筛选符合节气的食物
            const seasonalFoods = foodDatabase.filter(food => {
                return food.seasons && food.seasons.some(s => nearbySeasons.includes(s));
            });

            return { seasonalFoods, nearbySeasons };
        }

        // 抽签主函数
        function drawFortune() {
            const button = document.getElementById('fortuneButton');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            // 播放点击音效
            playSound('click');

            // 禁用按钮，显示加载动画
            button.disabled = true;
            button.textContent = '🎲 正在抽签...';
            loading.classList.add('show');
            result.classList.remove('show');

            // 模拟抽签过程
            setTimeout(() => {
                // 获取时令信息
                const season = getCurrentSeason();

                // 获取符合当前节气的食物
                const { seasonalFoods, nearbySeasons } = getSeasonalFoods(season);

                // 决定推荐数量和策略
                const count = Math.random() > 0.5 ? 2 : 1;
                const selectedFoods = [];
                const usedIndices = new Set();

                // 70%概率优先推荐时令食物，30%概率随机推荐
                const prioritizeSeasonal = Math.random() < 0.7;

                if (prioritizeSeasonal && seasonalFoods.length > 0) {
                    // 优先从时令食物中选择
                    while (selectedFoods.length < count && selectedFoods.length < seasonalFoods.length) {
                        const index = Math.floor(Math.random() * seasonalFoods.length);
                        if (!usedIndices.has(index)) {
                            usedIndices.add(index);
                            selectedFoods.push({
                                ...seasonalFoods[index],
                                isSeasonal: true,
                                matchedSeason: seasonalFoods[index].seasons.find(s => nearbySeasons.includes(s))
                            });
                        }
                    }

                    // 如果时令食物不够，从全部食物中补充
                    while (selectedFoods.length < count) {
                        const index = Math.floor(Math.random() * foodDatabase.length);
                        if (!usedIndices.has(index)) {
                            usedIndices.add(index);
                            selectedFoods.push({ ...foodDatabase[index], isSeasonal: false });
                        }
                    }
                } else {
                    // 随机推荐
                    while (selectedFoods.length < count) {
                        const index = Math.floor(Math.random() * foodDatabase.length);
                        if (!usedIndices.has(index)) {
                            usedIndices.add(index);
                            // 检查是否恰好符合节气
                            const isSeasonal = foodDatabase[index].seasons &&
                                foodDatabase[index].seasons.some(s => nearbySeasons.includes(s));
                            selectedFoods.push({
                                ...foodDatabase[index],
                                isSeasonal,
                                matchedSeason: isSeasonal ? foodDatabase[index].seasons.find(s => nearbySeasons.includes(s)) : null
                            });
                        }
                    }
                }

                // 显示结果
                displayResult(selectedFoods, season, nearbySeasons);

                // 播放音效和烟花
                playSound('success');
                createFirework();
                playSound('reveal');

                // 恢复按钮
                button.disabled = false;
                button.textContent = '🎲 再次抽签';
                loading.classList.remove('show');
            }, 2000);
        }

        // 显示结果
        function displayResult(foods, season, nearbySeasons) {
            const resultDiv = document.getElementById('result');
            const seasonTag = document.getElementById('seasonTag');
            const foodItems = document.getElementById('foodItems');
            const fortuneSignature = document.getElementById('fortuneSignature');
            const recommendation = document.getElementById('recommendation');

            // 设置时令标签
            const seasonalInfo = foods.some(f => f.isSeasonal)
                ? `${season.emoji} ${season.name}时令推荐`
                : `${season.emoji} ${season.name}食运`;
            seasonTag.textContent = seasonalInfo;

            // 清空并添加食物项
            foodItems.innerHTML = '';
            foods.forEach(food => {
                const foodItem = document.createElement('div');
                foodItem.className = 'food-item';

                // 随机选择签名和推荐理由
                const signature = food.signatures[Math.floor(Math.random() * food.signatures.length)];
                const recommend = food.recommendations[Math.floor(Math.random() * food.recommendations.length)];

                // 判断是否有时令标签
                const seasonBadge = food.isSeasonal
                    ? `<div style="background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%); color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; display: inline-block; margin-top: 8px;">🌸 ${food.matchedSeason || season.name}时令</div>`
                    : '';

                foodItem.innerHTML = `
                    <div class="food-emoji">${food.emoji}</div>
                    <div class="food-name">${food.name}</div>
                    <div style="color: #999; font-size: 0.9rem; margin-bottom: 10px;">
                        ${food.category} · ${food.region}风味
                    </div>
                    ${seasonBadge}
                `;
                foodItems.appendChild(foodItem);
            });

            // 设置食运签名（使用第一个食物的签名）
            fortuneSignature.textContent = foods[0].signatures[Math.floor(Math.random() * foods[0].signatures.length)];

            // 设置推荐理由（合并多个食物的推荐，并添加节气说明）
            let recommendationText = '';

            // 如果有时令食物，添加节气说明
            const seasonalFoods = foods.filter(f => f.isSeasonal);
            if (seasonalFoods.length > 0) {
                const seasonalFoodNames = seasonalFoods.map(f => f.name).join('、');
                recommendationText += `【${season.name}时令】正值${season.name}时节，特别推荐${seasonalFoodNames}等时令美食，顺应节气而食，养生又吉利！\n\n`;
            } else {
                recommendationText += `【${season.name}时节】当前虽非特定食物的时令，但美食不分时节，随缘即是最好。\n\n`;
            }

            foods.forEach((food, index) => {
                const recommend = food.recommendations[Math.floor(Math.random() * food.recommendations.length)];
                recommendationText += `【${food.name}】${food.isSeasonal ? '🌸时令推荐：' : ''}${recommend}`;
            });
            recommendation.textContent = recommendationText;

            // 显示结果
            resultDiv.classList.add('show');
        }

        // 页面加载完成提示
        window.onload = function() {
            console.log('🥢 今日食运已准备就绪！');
        };
    </script>
</body>
