<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧧 春节专属IP - 2025新版</title>
    <style>
        /* ==================== Reset & Base ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #DC143C;
            --primary-gold: #FFD700;
            --dark-red: #8B0000;
            --light-cream: #FFF5E6;
            --orange-red: #FF4500;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 50%, var(--orange-red) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ==================== Canvas Background ==================== */
        .fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ==================== Lantern Decorations ==================== */
        .lantern {
            position: fixed;
            width: 60px;
            height: 80px;
            background: radial-gradient(ellipse at center, #FF6B6B 0%, var(--primary-red) 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.8), inset 0 0 20px rgba(255, 215, 0, 0.3);
            animation: swing 3s ease-in-out infinite;
            z-index: 1;
        }

        .lantern::before {
            content: '福';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--primary-gold);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 30px;
            background: linear-gradient(to bottom, var(--primary-gold), #FFA500);
            border-radius: 0 0 10px 10px;
        }

        .lantern-top {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background: var(--primary-gold);
            border-radius: 5px 5px 0 0;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .lantern-1 { top: 20px; left: 5%; animation-delay: 0s; }
        .lantern-2 { top: 20px; right: 5%; animation-delay: 0.5s; }
        .lantern-3 { top: 120px; left: 8%; animation-delay: 1s; }
        .lantern-4 { top: 120px; right: 8%; animation-delay: 1.5s; }

        /* ==================== Main Container ==================== */
        .container {
            background: linear-gradient(145deg, var(--light-cream) 0%, #FFE4CC 100%);
            border-radius: 30px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(139, 0, 0, 0.5), 0 0 100px rgba(255, 215, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 4px solid var(--primary-gold);
            overflow: hidden;
        }

        /* ==================== Header ==================== */
        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--orange-red) 50%, var(--primary-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(220, 20, 60, 0.8)); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--dark-red);
            margin-bottom: 20px;
            font-weight: 500;
        }

        .version-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        /* ==================== Form Sections ==================== */
        .form-section {
            text-align: left;
            margin-bottom: 25px;
        }

        .form-label {
            font-size: 1.1rem;
            color: var(--dark-red);
            font-weight: bold;
            margin-bottom: 12px;
            display: block;
        }

        .form-label::before {
            content: '✨';
            margin-right: 8px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .option-btn {
            background: linear-gradient(145deg, #FFF 0%, #FFE4CC 100%);
            border: 2px solid var(--primary-gold);
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            color: var(--dark-red);
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(139, 0, 0, 0.1);
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.3);
            border-color: var(--primary-red);
        }

        .option-btn.selected {
            background: linear-gradient(145deg, var(--primary-red) 0%, var(--orange-red) 100%);
            color: white;
            border-color: var(--primary-gold);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.5);
        }

        /* ==================== Main Action Button ==================== */
        .action-button {
            background: linear-gradient(145deg, var(--primary-red) 0%, var(--orange-red) 50%, var(--primary-gold) 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.5);
            position: relative;
            overflow: hidden;
            font-weight: bold;
            letter-spacing: 3px;
            margin-top: 20px;
        }

        .action-button:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        .action-button:active:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
        }

        .action-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ==================== Blind Box Animation ==================== */
        .blindbox-container {
            display: none;
            margin: 40px 0;
            perspective: 1000px;
        }

        .blindbox-container.show {
            display: block;
        }

        .blindbox {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .blindbox-body {
            width: 150px;
            height: 150px;
            background: linear-gradient(145deg, #FF6B6B 0%, var(--primary-red) 100%);
            border-radius: 20px;
            margin: 25px auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 30px rgba(255, 215, 0, 0.3);
            border: 3px solid var(--primary-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .blindbox-ribbon {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background: linear-gradient(to right, var(--primary-gold), #FFA500);
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0 100%);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .blindbox.open {
            animation: shake 0.5s ease-in-out 3, openBox 0.8s ease-out 1.5s forwards;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        @keyframes openBox {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* ==================== Result Section ==================== */
        .result-section {
            display: none;
            margin-top: 40px;
            animation: fadeInUp 1s ease;
        }

        .result-section.show {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== IP Card ==================== */
        .ip-card {
            background: linear-gradient(145deg, var(--light-cream) 0%, #FFE4CC 100%);
            border: 4px solid var(--primary-gold);
            border-radius: 25px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 15px 40px rgba(139, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .ip-card::before {
            content: '🎨';
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 2rem;
            animation: bounce 1s ease infinite;
        }

        .ip-card::after {
            content: '✨';
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            animation: bounce 1s ease infinite 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ==================== IP Image ==================== */
        .ip-image-container {
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 5px solid var(--primary-gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, #FFE4CC 0%, var(--primary-gold) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ip-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .ip-image:hover {
            transform: scale(1.1);
        }

        .ip-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--dark-red);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #FFE4CC;
            border-top-color: var(--primary-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .ip-avatar {
            font-size: 6rem;
            margin: 20px 0;
            animation: avatarFloat 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .ip-name {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--orange-red) 50%, var(--primary-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
        }

        .ip-title {
            font-size: 1.3rem;
            color: var(--dark-red);
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #FFE4CC 0%, var(--primary-gold) 100%);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            border: 2px solid var(--primary-red);
        }

        /* ==================== Signature Card ==================== */
        .signature-card {
            background: linear-gradient(135deg, var(--primary-gold) 0%, #FFA500 100%);
            padding: 25px;
            border-radius: 20px;
            margin: 20px 0;
            border: 3px dashed var(--dark-red);
            position: relative;
            box-shadow: 0 10px 25px rgba(139, 0, 0, 0.2);
        }

        .signature-card::before {
            content: '🤖 AI生成';
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .signature-label {
            font-size: 1rem;
            color: var(--dark-red);
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .signature-text {
            font-size: 1.3rem;
            color: var(--dark-red);
            font-weight: bold;
            line-height: 1.8;
            font-style: italic;
        }

        /* ==================== Recommendation Card ==================== */
        .recommendation-card {
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
            text-align: left;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .recommendation-card::before {
            content: '🤖 AI智能分析';
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .recommendation-label {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .recommendation-text {
            font-size: 1.05rem;
            line-height: 1.8;
            white-space: pre-line;
        }

        /* ==================== Responsive Design ==================== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 25px;
            }

            .title {
                font-size: 1.8rem;
            }

            .ip-name {
                font-size: 1.8rem;
            }

            .ip-image-container {
                width: 250px;
                height: 250px;
            }

            .action-button {
                padding: 15px 40px;
                font-size: 1.2rem;
            }

            .option-btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }

            .lantern {
                width: 40px;
                height: 60px;
            }

            .lantern::before {
                font-size: 18px;
            }
        }

        /* ==================== Utility Classes ==================== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas class="fireworks-canvas" id="fireworksCanvas"></canvas>

                <button type="button" class="action-button" id="resetButton">

        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== Application State ====================
            const AppState = {
                selection: { gender: null, age: null, animal: null },
                animals: ['龙', '虎', '兔', '蛇', '马', '羊', '猴', '鸡', '狗', '猪', '鼠', '牛'],

                reset() {
                    this.selection = { gender: null, age: null, animal: null };
                },

                isComplete() {
                    return this.selection.gender && this.selection.age && this.selection.animal;
                }
            };

            // ==================== Audio Manager ====================
            const AudioManager = {
                ctx: null,

                init() {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                },

                play(type) {
                    this.init();
                    try {
                        if (type === 'select') {
                            this.playTone(600, 800, 0.15, 0.2);
                        } else if (type === 'open') {
                            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                                setTimeout(() => this.playTone(freq, freq, 0.3, 0.3), i * 200);
                            });
                        } else if (type === 'reveal') {
                            this.playTone(400, 1000, 0.3, 0.5);
                        }
                    } catch (e) {
                        console.warn('Audio playback failed:', e);
                    }
                },

                playTone(startFreq, endFreq, volume, duration) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
                    if (startFreq !== endFreq) {
                        osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + duration);
                }
            };

            // ==================== Data Manager ====================
            const DataManager = {
                blessings: {
                    '龙': [
                        '金龙献瑞，财源滚滚而来！新的一年里，如龙腾飞，事业高升，财运亨通！',
                        '祥龙昂首，福禄寿喜齐聚！龙年大吉，愿你在新的一年里龙马精神，身体健康，事业兴旺！',
                        '龙行龘龘，前程万里！愿金龙宝宝守护着你，新的一年里大展宏图，心想事成！',
                        '金龙贺春，富贵吉祥！祝福你在新的一年里如龙入海，势不可挡，财源广进！'
                    ],
                    '虎': [

                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            container.innerHTML = `<img src="${imageUrl}" alt="${animal} IP形象" class="ip-image">`;
                            resolve(true);
                        };
                        img.onerror = () => {
                            container.innerHTML = `<span class="ip-avatar">${this.emojiMap[animal]}</span>`;

                        };
                        img.src = imageUrl;

                    this.elements.form.classList.add('hidden');

                showResult() {
                    this.elements.blindboxContainer.classList.remove('show');

                },

                    });

                updateDrawButton() {
                    this.elements.drawButton.disabled = !AppState.isComplete();

                    this.elements.signatureText.textContent = DataManager.getBlessing(animal);
                    this.elements.recommendationText.textContent = DataManager.getRecommendation(animal);
                }
            };

            // ==================== Fireworks ====================
            const Fireworks = {
                canvas: document.getElementById('fireworksCanvas'),
                ctx: null,
                particles: [],

                init() {
                    this.ctx = this.canvas.getContext('2d');
                    this.resize();
                    window.addEventListener('resize', () => this.resize());
                    this.animate();
                },

                resize() {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                },

                createParticle() {
                    return {
                        x: Math.random() * this.canvas.width,
                        y: this.canvas.height,
                        speed: Math.random() * 3 + 2,
                        radius: Math.random() * 2 + 1,
                        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.01
                    };
                },

                animate() {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                    // Add new particles occasionally
                    if (this.particles.length < 100) {
                        this.particles.push(this.createParticle());
                    }

                    // Update and draw particles
                    this.particles = this.particles.filter(p => {
                        p.y -= p.speed;
                        p.alpha -= p.decay;

                        if (p.alpha <= 0 || p.y < 0) return false;

                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        this.ctx.fillStyle = p.color;
                        this.ctx.globalAlpha = p.alpha;
                        this.ctx.fill();
                        this.ctx.globalAlpha = 1;

                        return true;
                    });

                    requestAnimationFrame(() => this.animate());
                },

                burst() {
                    const colors = ['#FF6B6B', '#FFD700', '#FF4500', '#FFA500', '#FF69B4', '#00FF00'];
                    for (let i = 0; i < 50; i++) {
                        setTimeout(() => {
                            const p = this.createParticle();
                            p.x = Math.random() * this.canvas.width;
                            p.y = Math.random() * this.canvas.height;
                            p.color = colors[Math.floor(Math.random() * colors.length)];
                            this.particles.push(p);
                        }, i * 30);
                    }
                }
            };

            // ==================== Event Handlers ====================
            function handleOptionClick(button) {
                const group = button.parentElement;
                const groupType = group.dataset.group;
                const value = button.dataset.value;

                // Update selection
                AppState.selection[groupType] = value;

                // Update UI
                group.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
                button.classList.add('selected');

                UI.updateDrawButton();
                AudioManager.play('select');
            }

            async function handleDraw() {
                UI.showBlindbox();
                AudioManager.play('select');

                setTimeout(() => {
                    UI.elements.blindbox.classList.add('open');
                    AudioManager.play('open');
                    Fireworks.burst();

                    setTimeout(async () => {
                        const animal = AppState.selection.animal === '随机'
                            ? DataManager.getRandomAnimal()
                            : AppState.selection.animal;

                        await ImageGenerator.generate(animal, AppState.selection.age);
                        UI.updateResult(animal);
                        UI.showResult();
                        AudioManager.play('reveal');
                    }, 2000);
                }, 500);
            }

            function handleReset() {
                AppState.reset();
                UI.reset();
            }

            // ==================== Initialization ====================
            function init() {
                // Bind option buttons
                document.querySelectorAll('.option-btn').forEach(button => {
                    button.addEventListener('click', () => handleOptionClick(button));
                });

                // Bind action buttons
                UI.elements.drawButton.addEventListener('click', handleDraw);
                UI.elements.resetButton.addEventListener('click', handleReset);

                // Initialize fireworks
                Fireworks.init();

                console.log('🧧 春节专属IP 2025新版已准备就绪！');
            }

            // Start application when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
