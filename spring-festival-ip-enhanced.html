<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧧 春节专属IP - AI增强版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 50%, #FF4500 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 烟花背景 */
        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* 灯笼装饰 */
        .lantern {
            position: fixed;
            width: 60px;
            height: 80px;
            background: radial-gradient(ellipse at center, #FF6B6B 0%, #DC143C 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.8), inset 0 0 20px rgba(255, 215, 0, 0.3);
            animation: swing 3s ease-in-out infinite;
            z-index: 1;
        }

        .lantern::before {
            content: '福';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 30px;
            background: linear-gradient(to bottom, #FFD700, #FFA500);
            border-radius: 0 0 10px 10px;
        }

        .lantern-top {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background: #FFD700;
            border-radius: 5px 5px 0 0;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .lantern-1 { top: 20px; left: 5%; animation-delay: 0s; }
        .lantern-2 { top: 20px; right: 5%; animation-delay: 0.5s; }
        .lantern-3 { top: 120px; left: 8%; animation-delay: 1s; }
        .lantern-4 { top: 120px; right: 8%; animation-delay: 1.5s; }

        /* 主容器 */
        .container {
            background: linear-gradient(145deg, #FFF5E6 0%, #FFE4CC 100%);
            border-radius: 30px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(139, 0, 0, 0.5),
                        0 0 100px rgba(255, 215, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 4px solid #FFD700;
            overflow: hidden;
        }

        /* 标题 */
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #DC143C 0%, #FF4500 50%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: titleGlow 2s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(220, 20, 60, 0.8)); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: #8B0000;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .ai-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        /* 表单样式 */
        .form-section {
            text-align: left;
            margin-bottom: 25px;
        }

        .form-label {
            font-size: 1.1rem;
            color: #8B0000;
            font-weight: bold;
            margin-bottom: 12px;
            display: block;
        }

        .form-label::before {
            content: '✨';
            margin-right: 8px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .option-btn {
            background: linear-gradient(145deg, #FFF 0%, #FFE4CC 100%);
            border: 2px solid #FFD700;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            color: #8B0000;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(139, 0, 0, 0.1);
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.3);
            border-color: #DC143C;
        }

        .option-btn.selected {
            background: linear-gradient(145deg, #DC143C 0%, #FF4500 100%);
            color: white;
            border-color: #FFD700;
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.5);
        }

        /* 抽盲盒按钮 */
        .blindbox-button {
            background: linear-gradient(145deg, #DC143C 0%, #FF4500 50%, #FFD700 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.5);
            position: relative;
            overflow: hidden;
            font-weight: bold;
            letter-spacing: 3px;
            margin-top: 20px;
        }

        .blindbox-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        .blindbox-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .blindbox-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 盲盒动画 */
        .blindbox-container {
            display: none;
            margin: 40px 0;
            perspective: 1000px;
        }

        .blindbox-container.show {
            display: block;
        }

        .blindbox {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .blindbox-body {
            width: 150px;
            height: 150px;
            background: linear-gradient(145deg, #FF6B6B 0%, #DC143C 100%);
            border-radius: 20px;
            margin: 25px auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                        inset 0 0 30px rgba(255, 215, 0, 0.3);
            border: 3px solid #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .blindbox-ribbon {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background: linear-gradient(to right, #FFD700, #FFA500);
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .blindbox-open {
            animation: shake 0.5s ease-in-out 3, openBox 0.8s ease-out 1.5s forwards;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        @keyframes openBox {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* 结果展示 */
        .result {
            display: none;
            margin-top: 40px;
            animation: fadeInUp 1s ease;
        }

        .result.show {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* IP形象卡片 - 增强版 */
        .ip-card {
            background: linear-gradient(145deg, #FFF5E6 0%, #FFE4CC 100%);
            border: 4px solid #FFD700;
            border-radius: 25px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 15px 40px rgba(139, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .ip-card::before {
            content: '🎨';
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 2rem;
            animation: bounce 1s ease infinite;
        }

        .ip-card::after {
            content: '✨';
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            animation: bounce 1s ease infinite 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* AI生成的图片展示 */
        .ip-image-container {
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 5px solid #FFD700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, #FFE4CC 0%, #FFD700 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ip-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .ip-image:hover {
            transform: scale(1.1);
        }

        .ip-image-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8B0000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #FFE4CC;
            border-top-color: #DC143C;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .ip-avatar {
            font-size: 6rem;
            margin: 20px 0;
            animation: avatarFloat 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .ip-name {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #DC143C 0%, #FF4500 50%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
        }

        .ip-title {
            font-size: 1.3rem;
            color: #8B0000;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #FFE4CC 0%, #FFD700 100%);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            border: 2px solid #DC143C;
        }

        /* 签名卡片 - 增强版 */
        .signature-card {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            padding: 25px;
            border-radius: 20px;
            margin: 20px 0;
            border: 3px dashed #8B0000;
            position: relative;
            box-shadow: 0 10px 25px rgba(139, 0, 0, 0.2);
        }

        .signature-card::before {
            content: '🤖 AI生成';
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .signature-label {
            font-size: 1rem;
            color: #8B0000;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .signature-text {
            font-size: 1.3rem;
            color: #8B0000;
            font-weight: bold;
            line-height: 1.8;
            font-style: italic;
        }

        /* 推荐理由 - 增强版 */
        .recommendation {
            background: linear-gradient(135deg, #DC143C 0%, #8B0000 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
            text-align: left;
            border: 3px solid #FFD700;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .recommendation::before {
            content: '🤖 AI智能生成';
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .recommendation {
            position: relative;
        }

        .recommendation-label {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .recommendation-text {
            font-size: 1.05rem;
            line-height: 1.8;
            white-space: pre-line;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .title {
                font-size: 1.8rem;
            }

            .ip-name {
                font-size: 1.8rem;
            }

            .ip-image-container {
                width: 250px;
                height: 250px;
            }

            .blindbox-button {
                padding: 15px 40px;
                font-size: 1.2rem;
            }

            .container {
                padding: 25px;
            }

            .option-btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }

            .lantern {
                width: 40px;
                height: 60px;
            }

            .lantern::before {
                font-size: 18px;
            }
        }

        /* 装饰元素 */
        .decoration {
            position: absolute;
            font-size: 2rem;
            opacity: 0.4;
            animation: float 3s ease-in-out infinite;
        }

        .deco-1 { top: 30px; left: 30px; animation-delay: 0s; }
        .deco-2 { top: 30px; right: 30px; animation-delay: 0.3s; }
        .deco-3 { bottom: 30px; left: 30px; animation-delay: 0.6s; }
        .deco-4 { bottom: 30px; right: 30px; animation-delay: 0.9s; }
    </style>
</head>
<body>
    <!-- 烟花画布 -->
    <canvas class="fireworks" id="fireworks"></canvas>

    <!-- 灯笼装饰 -->
    <div class="lantern lantern-1">
        <div class="lantern-top"></div>
    </div>
    <div class="lantern lantern-2">
        <div class="lantern-top"></div>
    </div>
    <div class="lantern lantern-3">
        <div class="lantern-top"></div>
    </div>
    <div class="lantern lantern-4">
        <div class="lantern-top"></div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 装饰 -->
        <div class="decoration deco-1">🧧</div>
        <div class="decoration deco-2">🎊</div>
        <div class="decoration deco-3">🎉</div>
        <div class="decoration deco-4">✨</div>

        <!-- 标题 -->
        <h1 class="title">🧧 春节专属IP 🧧</h1>
        <p class="subtitle">AI智能生成你的新年动物守护神</p>
        <div class="ai-badge">🤖 AI增强版</div>

        <!-- 输入表单 -->
        <div id="inputForm">
            <!-- 性别选择 -->
            <div class="form-section">
                <label class="form-label">选择性别</label>
                <div class="option-group" id="genderOptions">
                    <button class="option-btn" data-group="gender" data-value="男" onclick="selectOption(this)">👨 男生</button>
                    <button class="option-btn" data-group="gender" data-value="女" onclick="selectOption(this)">👩 女生</button>
                </div>
            </div>

            <!-- 年龄段选择 -->
            <div class="form-section">
                <label class="form-label">选择年龄段</label>
                <div class="option-group" id="ageOptions">
                    <button class="option-btn" data-group="age" data-value="儿童" onclick="selectOption(this)">👶 儿童 (0-12岁)</button>
                    <button class="option-btn" data-group="age" data-value="少年" onclick="selectOption(this)">🧒 少年 (13-17岁)</button>
                    <button class="option-btn" data-group="age" data-value="青年" onclick="selectOption(this)">🧑 青年 (18-35岁)</button>
                    <button class="option-btn" data-group="age" data-value="中年" onclick="selectOption(this)">👨 中年 (36-55岁)</button>
                    <button class="option-btn" data-group="age" data-value="老年" onclick="selectOption(this)">👴 老年 (55岁+)</button>
                </div>
            </div>

            <!-- 偏好动物选择 -->
            <div class="form-section">
                <label class="form-label">选择你喜欢的动物类型</label>
                <div class="option-group" id="animalOptions">
                    <button class="option-btn" data-group="animal" data-value="龙" onclick="selectOption(this)">🐉 龙</button>
                    <button class="option-btn" data-group="animal" data-value="虎" onclick="selectOption(this)">🐯 虎</button>
                    <button class="option-btn" data-group="animal" data-value="兔" onclick="selectOption(this)">🐰 兔</button>
                    <button class="option-btn" data-group="animal" data-value="蛇" onclick="selectOption(this)">🐍 蛇</button>
                    <button class="option-btn" data-group="animal" data-value="马" onclick="selectOption(this)">🐴 马</button>
                    <button class="option-btn" data-group="animal" data-value="羊" onclick="selectOption(this)">🐑 羊</button>
                    <button class="option-btn" data-group="animal" data-value="猴" onclick="selectOption(this)">🐵 猴</button>
                    <button class="option-btn" data-group="animal" data-value="鸡" onclick="selectOption(this)">🐔 鸡</button>
                    <button class="option-btn" data-group="animal" data-value="狗" onclick="selectOption(this)">🐕 狗</button>
                    <button class="option-btn" data-group="animal" data-value="猪" onclick="selectOption(this)">🐷 猪</button>
                    <button class="option-btn" data-group="animal" data-value="鼠" onclick="selectOption(this)">🐭 鼠</button>
                    <button class="option-btn" data-group="animal" data-value="牛" onclick="selectOption(this)">🐮 牛</button>
                    <button class="option-btn" data-group="animal" data-value="随机" onclick="selectOption(this)">🎲 随机惊喜</button>
                </div>
            </div>

            <!-- 抽盲盒按钮 -->
            <button class="blindbox-button" id="blindboxButton" onclick="drawBlindBox()" disabled>
                🎁 抽取新年IP
            </button>
        </div>

        <!-- 盲盒动画 -->
        <div class="blindbox-container" id="blindboxContainer">
            <div class="blindbox" id="blindbox">
                <div class="blindbox-body">
                    🎁
                </div>
                <div class="blindbox-ribbon"></div>
            </div>
            <p class="loading-text" style="margin-top: 20px;">AI正在为你生成专属IP...</p>
        </div>

        <!-- 结果展示 -->
        <div class="result" id="result">
            <div class="ip-card">
                <!-- AI生成的图片 -->
                <div class="ip-image-container" id="ipImageContainer">
                    <div class="ip-image-loading">
                        <div class="loading-spinner"></div>
                        <p>AI正在绘制你的专属IP...</p>
                    </div>
                </div>

                <div class="ip-name" id="ipName">金龙宝宝</div>
                <div class="ip-title" id="ipTitle">🧧 2025新年守护神 🧧</div>
            </div>

            <div class="signature-card">
                <div class="signature-label">✨ 春节祝福签名 ✨</div>
                <div class="signature-text" id="signatureText">正在生成...</div>
            </div>

            <div class="recommendation">
                <div class="recommendation-label">💫 AI推荐理由</div>
                <div class="recommendation-text" id="recommendationText">正在智能分析...</div>
            </div>

            <button class="blindbox-button" onclick="resetForm()" style="margin-top: 30px;">
                🎁 再抽一次
            </button>
        </div>
    </div>

    <script>
        // 用户选择
        let userSelection = {
            gender: null,
            age: null,
            animal: null
        };

        // 音效
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'select') {
                oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
            } else if (type === 'open') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.setValueAtTime(freq, audioContext.currentTime + index * 0.2);
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime + index * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.2 + 0.3);
                    osc.start(audioContext.currentTime + index * 0.2);
                    osc.stop(audioContext.currentTime + index * 0.2 + 0.3);
                });
            } else if (type === 'reveal') {
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioContext.currentTime + 0.5);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            }
        }

        // 选择选项 - 使用data属性获取值

                '少年': 'anime style, young',

                '老年': 'wise style'
            };

            const prompt = `cute ${styleMap[animal]} character, Chinese New Year theme, red and gold colors, ${ageStyle[age] || ''}, festive, high quality, detailed`;

                img.onload = () => {
                    imageContainer.innerHTML = '';
                    const imgElement = document.createElement('img');
                    imgElement.src = imageUrl;
                    imgElement.className = 'ip-image';
                    imgElement.alt = `${animal}IP形象`;
                    imageContainer.appendChild(imgElement);
                    resolve(imageUrl);
                };
                img.onerror = () => {

                    const emojiMap = {
                        '龙': '🐉', '虎': '🐯', '兔': '🐰', '蛇': '🐍',

                    imageContainer.innerHTML = `<span class="ip-avatar">${emojiMap[animal]}</span>`;

        // 创建烟花效果
        function createFireworks() {
            const colors = ['#FF6B6B', '#FFD700', '#FF4500', '#FFA500', '#FF69B4', '#00FF00'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'firework-particle';
                    particle.style.left = Math.random() * window.innerWidth + 'px';
                    particle.style.top = Math.random() * window.innerHeight + 'px';
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(particle);

                    setTimeout(() => {
                        particle.remove();
                    }, 1500);
                }, i * 30);
            }
        }

        // 烟花动画
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Firework {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.speed = Math.random() * 3 + 2;
                this.radius = Math.random() * 2 + 1;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }

            update() {
                this.y -= this.speed;
                this.alpha -= this.decay;

                if (this.alpha <= 0 || this.y < 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        const fireworks = [];
        for (let i = 0; i < 100; i++) {
            fireworks.push(new Firework());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            fireworks.forEach(fw => {
                fw.update();
                fw.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        window.onload = function() {
            console.log('🧧 春节专属IP AI增强版已准备就绪！');
